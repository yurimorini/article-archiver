openapi: 3.1.0
info:
  title: 'Eleanor API'
  summary: 'The Eleanor HTTP API: archive the article of a web page.'
  version: 0.1.0
paths:
  /api/archives:
    post:
      summary: 'Archive the page at a URL.'
      description: 'Answers 201 for a new archive and 200 for a page already archived.'
      operationId: createArchive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArchiveBody'
      responses:
        '200':
          description: 'The page was already archived.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveResponse'
        '201':
          description: 'The page was archived.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveResponse'
        '400':
          description: 'The request or the URL was refused.'
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code: { type: string, enum: [invalid_json, invalid_body, url_syntax, url_policy, url_rejected] }
                  message: { type: string }
                type: object
        '415':
          description: 'The request is not sent as JSON.'
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code: { type: string, enum: [unsupported_media_type] }
                  message: { type: string }
                type: object
        '422':
          description: 'The page cannot be archived.'
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code: { type: string, enum: [extract_no_content, sanitized_empty, redirect, content_type, body_too_large] }
                  message: { type: string }
                type: object
        '500':
          description: 'Eleanor failed.'
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code: { type: string, enum: [encoding, extract, sanitize, archive_not_written, unexpected] }
                  message: { type: string }
                type: object
        '502':
          description: "The page's site could not be reached or answered with an error status."
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code: { type: string, enum: [transport, upstream_status] }
                  message: { type: string }
                type: object
components:
  schemas:
    CreateArchiveBody:
      description: 'Body of the archive command. It is not an archive, an article, or a URL pointer.'
      required:
        - url
      properties:
        url:
          description: 'Null is refused. An empty string is kept.'
          type: string
      type: object
    ArchiveResponse:
      description: 'Success body of the archive command: where the page lives and what it is called.'
      required:
        - url
        - title
      properties:
        url:
          description: 'The URL of the archived page.'
          type: string
        title:
          description: 'The title of the archived article.'
          type: string
      type: object
