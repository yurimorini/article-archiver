monolog:
    channels:
        - deprecation
        - application
        - domain

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!application", "!domain"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!application", "!domain"]
            eleanor:
                type: stream
                path: "%kernel.logs_dir%/eleanor.%kernel.environment%.log"
                level: debug
                channels: ["application", "domain"]
                formatter: monolog.formatter.json
                include_stacktraces: true
                processors:
                    - Yumo\Eleanor\Request\RequestIdProcessor

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!application", "!domain"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            eleanor:
                type: stream
                path: "%kernel.logs_dir%/eleanor.%kernel.environment%.log"
                level: debug
                channels: ["application", "domain"]
                formatter: monolog.formatter.json
                include_stacktraces: true
                processors:
                    - Yumo\Eleanor\Request\RequestIdProcessor

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!application", "!domain"]
                buffer_size: 50
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 7
                level: debug
                formatter: monolog.formatter.json
                include_stacktraces: true
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!application", "!domain"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
                include_stacktraces: true
            eleanor:
                type: rotating_file
                path: "%kernel.logs_dir%/eleanor.%kernel.environment%.log"
                max_files: 7
                level: info
                channels: ["application", "domain"]
                formatter: monolog.formatter.json
                include_stacktraces: true
                processors:
                    - Yumo\Eleanor\Request\RequestIdProcessor
