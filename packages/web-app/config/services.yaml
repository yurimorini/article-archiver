# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # The email of the one owner. The bearer secret authenticates a call as this owner. The secret is the environment variable below.
    eleanor.owner_email: 'owner@example.com'

    # The bearer secret. A missing variable becomes the empty default.
    env(ELEANOR_BEARER_TOKEN): ''
    eleanor.bearer_token: '%env(ELEANOR_BEARER_TOKEN)%'

    # The directory that holds one SQLite file per owner.
    eleanor.data_dir: '%kernel.project_dir%/var/data'

    # The directory that holds the per-url lock files.
    eleanor.lock_dir: '%kernel.project_dir%/var/lock'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Yumo\Eleanor\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Yumo\ArtcleReader\Orchestrator\Orchestrator:
        factory: ['Yumo\ArtcleReader\Orchestrator\OrchestratorFactory', 'create']

    Yumo\Eleanor\Api\Owner\ConfiguredOwnerProvider:
        arguments:
            $email: '%eleanor.owner_email%'

    Yumo\Eleanor\Api\Owner\OwnerProvider:
        alias: Yumo\Eleanor\Api\Owner\AuthenticatedOwnerProvider

    Yumo\Eleanor\Api\Security\BearerAuthenticator:
        arguments:
            $secret: '%eleanor.bearer_token%'
            $email: '%eleanor.owner_email%'

    Yumo\Eleanor\Archive\Lock\FlockArchiveLockFactory:
        arguments:
            $lockDirectory: '%eleanor.lock_dir%'

    Yumo\Eleanor\Archive\Sqlite\SqliteArchiveStoreFactory:
        arguments:
            $dataDirectory: '%eleanor.data_dir%'

    Yumo\Eleanor\Request\RequestIdProcessor:
        tags:
            - { name: monolog.processor, handler: eleanor }

    Yumo\Eleanor\Import\CandidateStreamFactory:
        alias: Yumo\Eleanor\Import\LineCandidateStreamFactory
